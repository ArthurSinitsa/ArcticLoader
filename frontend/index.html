<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Arctic Loader</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    .row { display: flex; gap: .5rem; margin-bottom: .75rem; }
    input { flex: 1; padding: .5rem; }
    select { padding: .5rem; min-width: 14rem; }
    #state { margin-top: 1.5rem; }
    progress { width: 100%; }
    .error { color: #b00020; }
    .hint { color: #666; font-size: .875rem; }
    .hidden { display: none; }
    .account { display: flex; gap: .5rem; align-items: center; margin-bottom: 1rem; }
    #login-form input, #password-form input { flex: 1; }
  </style>
</head>
<body>
  <h1>Arctic Loader</h1>

  <div id="account" class="account hidden">
    <span id="who" class="hint"></span>
    <button type="button" id="signin">Вход</button>
    <button type="button" id="signout" class="hidden">Выход</button>
  </div>

  <form id="login-form" class="hidden">
    <div class="row">
      <input id="login-email" type="email" placeholder="Email" autocomplete="username" required>
      <input id="login-password" type="password" placeholder="Пароль"
             autocomplete="current-password" required>
      <button type="submit">Войти</button>
    </div>
    <div class="hint">Регистрация — через администратора: публичной формы нет.</div>
  </form>

  <form id="password-form" class="hidden">
    <div class="hint">Пароль временный — задайте свой, чтобы продолжить.</div>
    <div class="row">
      <input id="password-current" type="password" placeholder="Текущий пароль"
             autocomplete="current-password" required>
      <input id="password-new" type="password" placeholder="Новый пароль, от 8 символов"
             autocomplete="new-password" minlength="8" required>
      <button type="submit">Сменить</button>
    </div>
  </form>

  <form id="form">
    <div class="row">
      <input id="url" type="url" placeholder="Ссылка на видео" required autofocus>
    </div>
    <div class="row">
      <select id="quality" disabled>
        <option>Сначала вставь ссылку</option>
      </select>
      <button type="submit" id="submit" disabled>Скачать</button>
    </div>
  </form>

  <div id="title" class="hint"></div>
  <div id="state"></div>

  <script>
    // Временная страница: прогресс приходит по SSE. На Этапе 7 — React + PWA.
    const TERMINAL = ["ready", "failed", "cancelled", "expired"];
    const DEFAULT_QUALITY = "1080p";

    const STATUS_LABELS = {
      queued: "В очереди",
      extracting: "Читаю страницу",
      downloading: "Качаю",
      processing: "Сшиваю дорожки",
    };

    const form = document.getElementById("form");
    const urlInput = document.getElementById("url");
    const qualitySelect = document.getElementById("quality");
    const submitButton = document.getElementById("submit");
    const titleBox = document.getElementById("title");
    const state = document.getElementById("state");

    let loadedFor = null;

    const account = document.getElementById("account");
    const who = document.getElementById("who");
    const signInButton = document.getElementById("signin");
    const signOutButton = document.getElementById("signout");
    const loginForm = document.getElementById("login-form");
    const passwordForm = document.getElementById("password-form");

    // Гость тоже качает (раздел 2.5.1), поэтому вход — не преграда, а кнопка:
    // авторизованному просто положены лимиты повыше.
    refreshAccount();

    signInButton.addEventListener("click", () => toggle(loginForm, true));
    signOutButton.addEventListener("click", async () => {
      await fetch("/api/auth/logout", { method: "POST" });
      refreshAccount();
    });

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        await request("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("login-email").value,
            password: document.getElementById("login-password").value,
          }),
        }, true);
        document.getElementById("login-password").value = "";
        toggle(loginForm, false);
        refreshAccount();
      } catch (error) {
        showError(error.message);
      }
    });

    passwordForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      try {
        await request("/api/auth/password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            current_password: document.getElementById("password-current").value,
            new_password: document.getElementById("password-new").value,
          }),
        }, true);
        passwordForm.reset();
        refreshAccount();
      } catch (error) {
        showError(error.message);
      }
    });

    async function refreshAccount() {
      const response = await fetch("/api/auth/me");
      const user = response.ok ? await response.json() : null;

      account.classList.remove("hidden");
      who.textContent = user ? `${user.name} · ${user.role}` : "Гость";
      toggle(signInButton, !user);
      toggle(signOutButton, Boolean(user));
      // С временным паролем ничего, кроме его смены, всё равно не работает.
      toggle(passwordForm, Boolean(user && user.must_change_password));
      toggle(form, !user || !user.must_change_password);
    }

    function toggle(element, visible) {
      element.classList.toggle("hidden", !visible);
    }

    // Список качества зависит от ролика: показывать 1080p там, где его нет,
    // значит обманывать — человек выберет и молча получит 720p.
    urlInput.addEventListener("change", loadFormats);
    urlInput.addEventListener("blur", loadFormats);

    async function loadFormats() {
      const url = urlInput.value.trim();
      if (!url || url === loadedFor) return;
      loadedFor = url;

      setQualityPlaceholder("Смотрю, что доступно…");
      titleBox.textContent = "";
      state.innerHTML = "";

      try {
        const data = await request(`/api/formats?url=${encodeURIComponent(url)}`);
        titleBox.textContent = `${data.title} · ${data.extractor}${formatDuration(data.duration)}`;
        fillQualities(data.options);
      } catch (error) {
        loadedFor = null;
        setQualityPlaceholder("Не удалось получить форматы");
        showError(error.message);
      }
    }

    function fillQualities(options) {
      qualitySelect.innerHTML = "";
      for (const option of options) {
        const element = document.createElement("option");
        element.value = option.quality;
        element.textContent = option.filesize
          ? `${option.label} — ${formatSize(option.filesize)}`
          : option.label;
        if (option.quality === DEFAULT_QUALITY) element.selected = true;
        qualitySelect.append(element);
      }
      qualitySelect.disabled = false;
      submitButton.disabled = false;
    }

    function setQualityPlaceholder(text) {
      qualitySelect.innerHTML = `<option>${text}</option>`;
      qualitySelect.disabled = true;
      submitButton.disabled = true;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      state.textContent = "Отправляю…";

      try {
        const created = await request("/api/downloads", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url: urlInput.value, quality: qualitySelect.value }),
        });
        watch(created.task_id);
      } catch (error) {
        showError(error.message);
      }
    });

    function watch(taskId) {
      const source = new EventSource(`/api/downloads/${taskId}/events`);

      source.onmessage = (event) => {
        const task = JSON.parse(event.data);
        render(task);
        // Закрываем сами: иначе браузер увидит обрыв и начнёт переподключаться.
        if (TERMINAL.includes(task.status)) source.close();
      };

      source.onerror = () => {
        // Разрыв — не ошибка: браузер переподключится сам. Молчим, чтобы не
        // затирать показанный прогресс.
        if (source.readyState === EventSource.CLOSED) {
          showError("соединение потеряно, обнови страницу");
        }
      };
    }

    function render(task) {
      if (task.status === "ready") {
        state.innerHTML = "";
        const link = document.createElement("a");
        link.href = task.download_url;
        if (!task.direct) link.download = "";
        link.textContent = `Скачать: ${task.title ?? "видео"}`;
        state.append(`Готово (${formatSize(task.file_size)}). `, link);
        if (task.direct) {
          const note = document.createElement("div");
          note.className = "hint";
          note.textContent = "Файл идёт напрямую с CDN, мимо сервера.";
          state.append(note);
        }
        return;
      }

      if (task.status === "failed") {
        showError(task.error_hint ?? task.error_code ?? "без описания");
        return;
      }

      const label = STATUS_LABELS[task.status] ?? task.status;
      state.innerHTML = `<div>${label}: ${task.title ?? ""}</div>`;
      const bar = document.createElement("progress");
      bar.max = 100;
      bar.value = task.progress;
      state.append(bar, ` ${task.progress.toFixed(1)}%`);
    }

    async function request(url, options, empty = false) {
      const response = await fetch(url, options);
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(describeError(body) ?? `HTTP ${response.status}`);
      }
      return empty ? null : response.json();
    }

    function describeError(body) {
      const detail = body.detail;
      if (!detail) return null;
      if (typeof detail === "string") return detail;
      // Отказ по квоте приходит без error_code, зато с готовым текстом.
      if (detail.message) {
        return detail.error_code ? `${detail.error_code}: ${detail.message}` : detail.message;
      }
      return JSON.stringify(detail);
    }

    function formatSize(bytes) {
      return bytes ? `${(bytes / 1024 / 1024).toFixed(1)} МБ` : "размер неизвестен";
    }

    function formatDuration(seconds) {
      if (!seconds) return "";
      const total = Math.round(seconds);
      const parts = [Math.floor(total / 3600), Math.floor(total / 60) % 60, total % 60];
      return " · " + parts
        .filter((value, index) => value > 0 || index > 0)
        .map((value, index) => (index === 0 ? value : String(value).padStart(2, "0")))
        .join(":");
    }

    function showError(message) {
      state.innerHTML = "";
      const box = document.createElement("div");
      box.className = "error";
      box.textContent = `Ошибка: ${message}`;
      state.append(box);
    }
  </script>
</body>
</html>
